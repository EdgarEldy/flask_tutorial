name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flask_tutorial
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: app.py
      # pytest's app fixtures call create_app("testing") regardless of this
      # value, but `flask db upgrade` resolves its config through
      # FLASK_ENV - without it here it would default to "development" and
      # migrate DATABASE_URL (flask_tutorial) while pytest reads/writes
      # TEST_DATABASE_URL (flask_tutorial_test), leaving the database
      # pytest actually uses unmigrated.
      FLASK_ENV: testing
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/flask_tutorial
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/flask_tutorial_test
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create the test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d flask_tutorial -tc "SELECT 1 FROM pg_database WHERE datname = 'flask_tutorial_test'" | grep -q 1 || \
          PGPASSWORD=postgres psql -h localhost -U postgres -d flask_tutorial -c "CREATE DATABASE flask_tutorial_test"

      - name: Apply migrations
        run: flask db upgrade

      - name: Run pytest
        run: pytest
